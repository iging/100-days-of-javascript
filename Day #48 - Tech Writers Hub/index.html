<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Writers Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1><i class="fas fa-newspaper"></i> Tech Writers Hub</h1>
            <p class="subtitle">Discover talented technology writers and journalists</p>
        </div>
    </header>

    <main class="container">
        <div id="author-container" class="authors-grid"></div>

        <div class="load-more-container">
            <button class="btn" id="load-more-btn">
                <span class="btn-text">Load More Writers</span>
                <span class="btn-loader" style="display: none;">
                    <i class="fas fa-spinner fa-spin"></i>
                </span>
            </button>
        </div>
    </main>


    <script src="./script.js"></script>
</body>

</html>
